services:
  web:
    build:
      context: .
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ../:/var/www/html:ro
    environment:
      DB_HOST: db
      DB_USER: app
      DB_PASSWORD: app_password
      DB_NAME: aplicaciones_web
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: local_root_password
      MARIADB_DATABASE: aplicaciones_web
      MARIADB_USER: app
      MARIADB_PASSWORD: app_password
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  database_data:
