<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creación de Perfil de Usuario</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="../navegacion.css">
  </head>
  <body>

    <nav class="site-breadcrumbs" aria-label="Migas de pan">
      <ol>
        <li><a href="../index.html">Parcial 1</a></li>
        <li aria-current="page">Registro de perfil</li>
      </ol>
      <a class="site-home-link" href="../index.html">Volver al índice principal</a>
    </nav>
    <div class="form-container">
      <h2>Registro de Perfil</h2>

      
      <form action="/guardar-perfil" method="POST">

      
        <div class="form-group">
          <label for="nombre">Nombre Completo *</label>
          <input type="text" id="nombre" name="nombre"
            placeholder="Ej. Juan Pérez" required>
        </div>

      
        <div class="form-group">
          <label for="correo">Correo Electrónico *</label>
          <input type="email" id="correo" name="correo"
            placeholder="ejemplo@correo.com" required>
        </div>

      
        <div class="form-group">
          <label for="password">Contraseña *</label>
          <input type="password" id="password" name="password" minlength="6"
            placeholder="Mínimo 6 caracteres" required>
        </div>

      
        <div class="form-group">
          <label for="fecha_nacimiento">Fecha de Nacimiento *</label>
          <input type="date" id="fecha_nacimiento" name="fecha_nacimiento"
            required>
        </div>

      
        <div class="form-group">
          <label>Género *</label>
          <div class="options-inline">
            <label>
              <input type="radio" name="genero" value="femenino" required>
              Femenino
            </label>
            <label>
              <input type="radio" name="genero" value="masculino"> Masculino
            </label>
            <label>
              <input type="radio" name="genero" value="otro"> Otro
            </label>
          </div>
        </div>

      
        <div class="form-group">
          <label for="pais">País de Residencia *</label>
          <select id="pais" name="pais" required>
            <option value>-- Selecciona un país --</option>
            <option value="MX">México</option>
            <option value="CO">Colombia</option>
            <option value="AR">Argentina</option>
            <option value="ES">España</option>
            <option value="otro">Otro</option>
          </select>
        </div>

      
        <div class="form-group">
          <label for="biografia">Biografía / Acerca de ti</label>
          <textarea id="biografia" name="biografia"
            placeholder="Cuéntanos un poco sobre tus intereses..."></textarea>
        </div>

        <!-- input: checkbox -->
        <div class="form-group checkbox-group">
          <label>
            <input type="checkbox" name="terminos" required> Acepto los términos
            y condiciones *
          </label>
        </div>

        <!-- button -->
        <button type="submit" href="#">Crear Cuenta</button>

      </form>
    </div>

  </body>
</html>
