<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parcial 3 | Aplicaciones Web</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #f3f4fa;
      background: #101329;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
    }

    main {
      width: min(100%, 560px);
      padding: 40px;
      border: 1px solid #343957;
      border-radius: 20px;
      background: #191e3a;
      box-shadow: 0 20px 60px rgb(0 0 0 / 25%);
    }

    p {
      color: #c1c5dc;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 16px;
      border-radius: 999px;
      color: #17192b;
      background: #ecd3ac;
      font-weight: 700;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 2px solid white;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <p>Aplicaciones Web · Parcial 3</p>
    <h1>Próximamente</h1>
    <p>Las prácticas de este parcial todavía no están disponibles.</p>
    <a href="../index.html">Volver a la página principal</a>
  </main>
</body>
</html>
